{% extends "ecom/layout.html" %}
{% block content %}
    <form action="{% url 'create product' %}">
        {% csrf_token -%}
        {% for field in form %}
            {% include "ecom/partials/create_product.html" with form=form field=field only %}
        {% endfor %}
    <button type="submit" class="text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800"></button>
    </form>
{% endblock content %}
